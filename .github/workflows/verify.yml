name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1
      - name: Build Debug
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Configuration Debug
      - name: Verify source and versions
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\verify.ps1
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotaFloat
          path: QuotaFloat.exe
          if-no-files-found: error
